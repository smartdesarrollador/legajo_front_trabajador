<div class="w-1/2 max-w-2xl mx-auto my-12 bg-white p-8 rounded-2xl shadow-md">
  <h2 class="text-2xl text-orange-500 font-bold mb-6">Crear Licencia</h2>

  <div
    *ngIf="errorMessage"
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
  >
    {{ errorMessage }}
  </div>

  <form [formGroup]="licenciaForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label for="fecha_emision" class="block font-bold text-gray-700 mb-1">
        Fecha de solicitud:
      </label>
      <input
        type="date"
        id="fecha_emision"
        formControlName="fecha_emision"
        readonly
        class="w-4/5 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
      />
    </div>

    <div>
      <label for="fecha_inicio" class="block font-bold text-gray-700 mb-1">
        Comenzando en:
      </label>
      <input
        type="date"
        id="fecha_inicio"
        formControlName="fecha_inicio"
        class="w-4/5 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
      />
    </div>

    <div>
      <label for="fecha_fin" class="block font-bold text-gray-700 mb-1">
        Terminando en:
      </label>
      <input
        type="date"
        id="fecha_fin"
        formControlName="fecha_fin"
        class="w-4/5 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
      />
    </div>

    <div>
      <label for="motivo" class="block font-bold text-gray-700 mb-1">
        Motivo de Solicitud:
      </label>
      <textarea
        id="motivo"
        formControlName="motivo"
        class="w-4/5 p-3 border border-gray-300 rounded-lg h-24 focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
      ></textarea>
    </div>

    <div
      *ngIf="licenciaForm.errors?.['fechasInvalidas']"
      class="text-red-600 text-sm mt-1"
    >
      La fecha de fin no puede ser anterior a la fecha de inicio
    </div>

    <button
      type="submit"
      [disabled]="!licenciaForm.valid || loading"
      class="w-1/2 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors duration-200 disabled:bg-gray-400"
    >
      {{ loading ? "Grabando..." : "Grabar" }}
    </button>
  </form>
</div>
