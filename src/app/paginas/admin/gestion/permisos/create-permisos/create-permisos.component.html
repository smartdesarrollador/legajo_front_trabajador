<div class="grid grid-cols-1">
  <div class="bg-white mr-14 mt-20 gap-y-14 p-10 rounded-[35px]">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Crear Permiso</h2>

    <form [formGroup]="permisoForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="flex flex-col space-y-2">
        <label for="fecha_solicitud" class="text-sm font-medium text-gray-700">
          Fecha de solicitud:
        </label>
        <input
          type="date"
          id="fecha_solicitud"
          formControlName="fecha_solicitud"
          readonly
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-gray-100"
        />
      </div>

      <div class="flex flex-col space-y-2">
        <label for="comenzando_en" class="text-sm font-medium text-gray-700">
          Comenzando en:
        </label>
        <input
          type="date"
          id="comenzando_en"
          formControlName="comenzando_en"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
        />
        <div
          *ngIf="permisoForm.get('comenzando_en')?.touched && permisoForm.get('comenzando_en')?.errors?.['required']"
          class="text-red-500 text-sm mt-1"
        >
          Este campo es requerido
        </div>
      </div>

      <div class="flex flex-col space-y-2">
        <label for="terminando_en" class="text-sm font-medium text-gray-700">
          Terminando en:
        </label>
        <input
          type="date"
          id="terminando_en"
          formControlName="terminando_en"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
        />
        <div
          *ngIf="permisoForm.get('terminando_en')?.touched && permisoForm.get('terminando_en')?.errors?.['required']"
          class="text-red-500 text-sm mt-1"
        >
          Este campo es requerido
        </div>
      </div>

      <div class="flex flex-col space-y-2">
        <label for="numero_horas" class="text-sm font-medium text-gray-700">
          Número de horas:
        </label>
        <input
          type="number"
          id="numero_horas"
          formControlName="numero_horas"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
        />
        <div
          *ngIf="permisoForm.get('numero_horas')?.touched && permisoForm.get('numero_horas')?.errors?.['required']"
          class="text-red-500 text-sm mt-1"
        >
          Este campo es requerido
        </div>
        <div
          *ngIf="permisoForm.get('numero_horas')?.touched && permisoForm.get('numero_horas')?.errors?.['min']"
          class="text-red-500 text-sm mt-1"
        >
          El número de horas debe ser mayor a 0
        </div>
      </div>

      <div class="flex flex-col space-y-2">
        <label for="motivo_solicitud" class="text-sm font-medium text-gray-700">
          Motivo de Solicitud:
        </label>
        <textarea
          id="motivo_solicitud"
          formControlName="motivo_solicitud"
          rows="4"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
        ></textarea>
        <div
          *ngIf="permisoForm.get('motivo_solicitud')?.touched && permisoForm.get('motivo_solicitud')?.errors?.['required']"
          class="text-red-500 text-sm mt-1"
        >
          Este campo es requerido
        </div>
      </div>

      <button
        type="submit"
        [disabled]="permisoForm.invalid"
        [ngClass]="{ 'opacity-50 cursor-not-allowed': permisoForm.invalid }"
        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors"
      >
        Grabar
      </button>
    </form>
  </div>
</div>
