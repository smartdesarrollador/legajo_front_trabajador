<div class="grid grid-cols-1">
  <div class="bg-white mr-14 mt-20 gap-y-14 p-10 rounded-[35px]">
    <h2 class="text-[#FF7A00] text-2xl mb-5">Consulta de Vacaciones</h2>

    <div class="flex gap-6">
      <!-- Formulario de búsqueda -->
      <div class="w-2/3">
        <form [formGroup]="vacacionesForm" (ngSubmit)="consultarVacaciones()">
          <div class="mb-4">
            <label for="tipo_vacaciones" class="block font-bold mb-2"
              >Tipo de Vacaciones:</label
            >
            <select
              id="tipo_vacaciones"
              formControlName="tipo_vacaciones"
              class="w-full p-2 border rounded"
            >
              <option value="">Seleccione un tipo</option>
              <option value="1">Vacaciones regulares</option>
              <option value="2">Adelanto de vacaciones</option>
              <option value="3">Acumulación de vacaciones</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="fecha_desde" class="block font-bold mb-2"
              >Fecha desde:</label
            >
            <input
              type="date"
              id="fecha_desde"
              formControlName="fecha_desde"
              class="w-full p-2 border rounded"
            />
          </div>

          <div class="mb-4">
            <label for="fecha_hasta" class="block font-bold mb-2"
              >Fecha hasta:</label
            >
            <input
              type="date"
              id="fecha_hasta"
              formControlName="fecha_hasta"
              class="w-full p-2 border rounded"
            />
          </div>

          <button
            type="submit"
            [disabled]="!vacacionesForm.valid || loading"
            class="bg-green-600 text-white px-4 py-2 rounded"
          >
            {{ loading ? "Consultando..." : "Consultar" }}
          </button>
        </form>
      </div>

      <!-- Control de Vacaciones -->
      <div class="w-1/3">
        <h3 class="text-[#FF7A00] text-xl mb-4">Control de Vacaciones</h3>
        <div class="space-y-4">
          <div>
            <label class="block font-bold mb-2">Acumuladas (+):</label>
            <input
              type="number"
              [value]="controlVacaciones.acumuladas"
              readonly
              class="w-full p-2 border rounded bg-gray-100"
            />
          </div>
          <div>
            <label class="block font-bold mb-2">Tomadas (-):</label>
            <input
              type="number"
              [value]="controlVacaciones.tomadas"
              readonly
              class="w-full p-2 border rounded bg-gray-100"
            />
          </div>
          <div>
            <label class="block font-bold mb-2">Restantes (=):</label>
            <input
              type="number"
              [value]="controlVacaciones.restantes"
              readonly
              class="w-full p-2 border rounded bg-gray-100"
            />
          </div>
          <button
            (click)="solicitarVacaciones()"
            class="w-full bg-blue-600 text-white px-4 py-2 rounded"
          >
            Solicitar Vacaciones
          </button>
        </div>
      </div>
    </div>

    <!-- Tabla de resultados -->
    <div class="mt-8">
      <table class="w-full border-collapse">
        <thead>
          <tr class="bg-gray-100">
            <th class="border p-2">Tipo</th>
            <th class="border p-2">Fecha Inicio</th>
            <th class="border p-2">Fecha Fin</th>
            <th class="border p-2">Días</th>
            <th class="border p-2">Estado</th>
            <th class="border p-2">Ver Acuerdo</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let vacacion of vacaciones">
            <td class="border p-2">{{ vacacion.tipo_vacaciones }}</td>
            <td class="border p-2">{{ vacacion.fecha_inicio }}</td>
            <td class="border p-2">{{ vacacion.fecha_fin }}</td>
            <td class="border p-2">{{ vacacion.dias }}</td>
            <td class="border p-2">
              <span
                class="inline-block w-3 h-3 rounded-full"
                [ngClass]="{
                  'bg-green-500': vacacion.estado?.estado === 'Aprobado',
                  'bg-red-500': vacacion.estado?.estado === 'Rechazado',
                  'bg-yellow-500': vacacion.estado?.estado === 'Pendiente'
                }"
              >
              </span>
            </td>
            <td class="border p-2">
              <a href="#" class="text-blue-600 hover:underline">Ver</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
