<div class="w-3/5 max-w-2xl mx-auto my-12 bg-white p-5 rounded-2xl shadow-md">
  <h2 class="text-2xl text-orange-500 mb-6">
    Solicitar Acumulación de Vacaciones
  </h2>

  <form [formGroup]="solicitudForm" (ngSubmit)="onSubmit()">
    <label for="tipo_vacaciones" class="block font-bold text-gray-700 mb-1">
      Tipo de Vacaciones:
    </label>

    <select
      id="tipo_vacaciones"
      formControlName="tipo_vacaciones"
      class="w-3/5 p-2.5 mb-4 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500"
    >
      <option value="">Seleccione una opción</option>
      <option value="regulares">Vacaciones regulares</option>
      <option value="adelanto">Adelanto de vacaciones</option>
      <option value="acumulacion" selected>Acumulación de vacaciones</option>
      <option value="venta">Venta de vacaciones</option>
    </select>

    <label for="fecha_solicitud" class="block font-bold text-gray-700 mb-1">
      Fecha de solicitud:
    </label>
    <input
      type="date"
      id="fecha_solicitud"
      formControlName="fecha_solicitud"
      class="w-3/5 p-2.5 mb-4 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500"
    />

    <label for="periodo_acumulado" class="block font-bold text-gray-700 mb-1">
      Periodo que desea acumular:
    </label>
    <input
      type="number"
      id="periodo_acumulado"
      formControlName="periodo_acumulado"
      class="w-3/5 p-2.5 mb-4 border border-gray-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-green-500"
    />

    <button
      type="submit"
      [disabled]="!solicitudForm.valid || loading"
      class="w-2/5 py-3 bg-green-600 text-white rounded-lg text-base cursor-pointer hover:bg-green-700 transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
    >
      {{ loading ? "Procesando..." : "Grabar" }}
    </button>
  </form>
</div>
